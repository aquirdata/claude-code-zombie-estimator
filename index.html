<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Zombie Estimator — Aquire AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --slate-950: #07101f;
      --slate-900: #111e2a;
      --slate-800: #172336;
      --slate-750: #1d2d45;
      --slate-700: #243551;
      --slate-600: #6a8eb0;
      --slate-400: #7ea2bc;
      --slate-300: #ccd8e8;
      --slate-200: #deeaf8;
      --blue-600: #12316c;
      --blue-500: #1b3d76;
      --blue-400: #5ecece;
      --blue-300: #35dfe7;
      --red-500: #e05252;
      --red-400: #f07878;
      --amber-400: #e8a83a;
      --green-400: #3dd6a0;
      --emerald-500: #2cc89a;
      --cyan: #35dfe7;
      --cyan-soft: #5ecece;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body { height: 100%; background: var(--slate-950); }
    body { font-family: var(--font-sans); color: var(--slate-200); overflow-x: hidden; }
    #root { min-height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--slate-900); }
    ::-webkit-scrollbar-thumb { background: var(--slate-700); border-radius: 3px; }

    /* Slider */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--slate-700);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--blue-500);
      box-shadow: 0 0 0 4px rgba(53,223,231,0.12);
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 0 7px rgba(53,223,231,0.18);
    }
    input[type=range]::-webkit-slider-runnable-track {
      height: 6px; border-radius: 3px;
    }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes scanLine { 0% { transform: translateY(-100%); } 100% { transform: translateY(400%); } }
    @keyframes glitch {
      0%,100% { clip-path: inset(0 0 100% 0); }
      10% { clip-path: inset(33% 0 55% 0); transform: translate(-2px,0); }
      20% { clip-path: inset(70% 0 10% 0); transform: translate(2px,0); }
      30% { clip-path: inset(10% 0 80% 0); transform: translate(0,0); }
      40% { clip-path: inset(50% 0 30% 0); transform: translate(-1px,0); }
      50% { clip-path: inset(0 0 0 0); transform: translate(0,0); }
    }
    @keyframes countUp { from { opacity: 0; } to { opacity: 1; } }
    @keyframes borderPulse {
      0%,100% { border-color: rgba(53,223,231,0.22); }
      50% { border-color: rgba(53,223,231,0.6); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes ripple {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(53,223,231,0.3); }
      70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(59,130,246,0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59,130,246,0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .fade-in { animation: fadeIn 0.5s ease forwards; }
    .slide-up { animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; }

    .shimmer-text {
      background: linear-gradient(90deg, var(--cyan-soft) 0%, #fff 40%, var(--cyan) 80%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(53,223,231,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(53,223,231,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .card-glow { box-shadow: 0 0 0 1px rgba(53,223,231,0.1), 0 20px 60px rgba(0,0,0,0.5); }
    .card-glow-strong { box-shadow: 0 0 0 1px rgba(53,223,231,0.22), 0 0 40px rgba(53,223,231,0.06), 0 20px 60px rgba(0,0,0,0.6); }

    /* Print styles */
    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body { background: #07101f !important; color: #deeaf8 !important; }
      .no-print { display: none !important; }
      .print-show { display: block !important; }
      .print-card { break-inside: avoid; }
      @page { margin: 16mm 14mm; size: A4; }
    }
    .print-header-block { display: none; }
    @media print { .print-header-block { display: flex !important; } }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Google Sheets config ────────────────────────────────────
// Paste your Apps Script web app URL below.
// Setup instructions: see README or ask for the Apps Script code.
const SHEET_ENDPOINT = 'YOUR_APPS_SCRIPT_WEB_APP_URL';


/* ── helpers ──────────────────────────────────────────────── */
const fmt = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);

function readURLParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    company: p.get('company') || '',
    spend: p.get('spend') ? Math.min(100000, Math.max(5000, parseInt(p.get('spend')))) : 25000,
    series: p.get('series') === 'C' ? 'C' : p.get('series') === 'B' ? 'B' : '',
  };
}

function calcReport(company, spend, series, rateB = 18, rateC = 24) {
  const wasteRate = (series === 'C' ? rateC : rateB) / 100;
  const annualSpend = spend * 12;
  const totalWaste = annualSpend * wasteRate;

  const storageLeak    = totalWaste * 0.45;
  const dataLayerWaste = totalWaste * 0.32;
  const complianceRisk = totalWaste * 0.16;
  const networkDrift   = totalWaste * 0.07;

  const modernizationScore = Math.round(100 - (wasteRate * 100) * 1.3 - (series === 'C' ? 3 : 0));
  const schemaRiskLevel    = series === 'C' ? 'ELEVATED' : 'MODERATE';
  const complianceLevel    = series === 'C' ? 'HIGH' : 'MEDIUM';
  const zombieCount        = Math.round(annualSpend / 1200 * (series === 'C' ? 1.4 : 1.0));

  return { wasteRate, annualSpend, totalWaste, storageLeak, dataLayerWaste, complianceRisk, networkDrift, modernizationScore, schemaRiskLevel, complianceLevel, zombieCount, company, spend, series };
}

/* ── signal data ──────────────────────────────────────────── */
const SIGNAL_CATEGORIES = [
  { label: 'Storage',         signals: ['S3 Cold Buckets','Orphaned Snapshots','EBS Volumes Unattached','Glacier Abandoned','GCS Nearline Unused','Blob Stale Containers','Object Lifecycle Gaps','Versioning Overhead'] },
  { label: 'Compute',         signals: ['Idle EC2 t3.xlarge','Overprovisioned EKS Nodes','Lambda Cold Start Waste','GKE Autopilot Gaps','Reserved Instance Drift','Spot Interruption Orphans','GPU Idle Hours','Fargate Underutil'] },
  { label: 'Semantic PII',    signals: ['Email Residue Detected','SSN Pattern Found','PHI Marker Scan','GDPR Artifact Trace','CCPA Scope Leak','PII in Log Streams','Unencrypted S3 PII','Residual Auth Tokens'] },
  { label: 'Network',         signals: ['Inter-AZ Transfer Leak','NAT Gateway Overcharge','VPN Tunnel Idle','CDN Redundancy Waste','Data Egress Anomaly','Load Balancer Orphan','IPv6 Transition Cost','Peering Drift'] },
  { label: 'Database',        signals: ['RDS Multi-AZ Idle','Aurora Serverless Spike','DynamoDB On-Demand Leak','ElastiCache Overalloc','Redshift Underused','MongoDB Atlas Zombie','Snowflake Credit Burn','BigQuery Slot Waste'] },
  { label: 'AI/ML Pipelines', signals: ['SageMaker Endpoint Idle','Training Job Orphan','Feature Store Leak','MLflow Artifact Stale','Vertex AI Zombie','Batch Inference Drift','Embedding Cache Waste','Vector DB Overalloc'] },
  { label: 'IAM & Auth',      signals: ['Root Credential Risk','Stale IAM Roles','Overpermissioned SVC','MFA Gap Detected','Cross-Account Leakage','OAuth Token Orphan','Service Mesh Auth Drift','RBAC Policy Bloat'] },
  { label: 'Observability',   signals: ['CloudWatch Log Volume','Datadog Zombie Metrics','Trace Retention Overrun','Alert Noise Ratio','Dashboard Orphan Count','Span Sampling Waste','Metric Cardinality Leak','Logging Pipeline Drift'] },
];

/* ── PHASE 1: Input ───────────────────────────────────────── */
function InputPhase({ onSubmit, defaults }) {
  const [company, setCompany] = useState(defaults.company);
  const [spend, setSpend]     = useState(defaults.spend);
  const [series, setSeries]   = useState(defaults.series);
  const [err, setErr]         = useState('');

  const pct = ((spend - 5000) / 95000) * 100;

  function handleSubmit(e) {
    e.preventDefault();
    if (!company.trim()) { setErr('Company name is required.'); return; }
    if (!series) { setErr('Please select a funding series.'); return; }
    setErr('');
    onSubmit(company.trim(), spend, series);
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--slate-950)' }} className="grid-bg">
      {/* Header */}
      <header className="no-print" style={{ padding: '28px 40px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid rgba(255,255,255,0.05)' }}>
        <AquireLogo height={46} />
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'var(--emerald-500)', animation: 'pulse 2s infinite' }}></div>
          <span style={{ fontSize: 12, color: 'var(--slate-400)', fontFamily: 'var(--font-mono)', letterSpacing: '0.05em' }}>LIVE DIAGNOSTIC ENGINE</span>
        </div>
      </header>

      {/* Hero */}
      <main style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 20px' }}>
        <div style={{ width: '100%', maxWidth: 560 }} className="fade-in">

          {/* Badge */}
          <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 28 }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '6px 18px', borderRadius: 99, background: 'rgba(53,223,231,0.06)', border: '1px solid rgba(94,206,206,0.25)', fontSize: 11, fontFamily: 'var(--font-mono)', color: 'var(--blue-300)', letterSpacing: '0.1em' }}>
              <span style={{ color: 'var(--blue-400)', fontSize: 13 }}>✦</span>
              AI INFRASTRUCTURE SCANNER · v4.1
            </div>
          </div>

          <h1 style={{ fontSize: 'clamp(34px,5vw,54px)', fontWeight: 600, fontFamily: 'var(--font-display)', textAlign: 'center', lineHeight: 1.1, letterSpacing: '-0.01em', marginBottom: 16 }}>
            The <em className="shimmer-text" style={{ fontStyle: 'italic' }}>Zombie</em> Estimator
          </h1>
          <p style={{ textAlign: 'center', color: 'var(--slate-400)', fontSize: 15, lineHeight: 1.75, maxWidth: 440, margin: '0 auto 40px', fontFamily: 'var(--font-sans)', fontWeight: 300 }}>
            Uncover the hidden infrastructure waste bleeding your cloud budget. Powered by 10,000+ metadata signals across storage, compute, and compliance layers.
          </p>

          {/* Form Card */}
          <form onSubmit={handleSubmit} style={{ background: 'var(--slate-900)', border: '1px solid rgba(255,255,255,0.07)', borderRadius: 20, padding: '36px', display: 'flex', flexDirection: 'column', gap: 28 }} className="card-glow">

            {/* Company */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <label style={{ fontSize: 12, fontFamily: 'var(--font-mono)', color: 'var(--slate-400)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Company Name</label>
              <input
                type="text"
                value={company}
                onChange={e => setCompany(e.target.value)}
                placeholder="e.g. Acme Corp"
                style={{ background: 'var(--slate-800)', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 10, padding: '14px 16px', fontSize: 15, color: 'var(--slate-200)', fontFamily: 'var(--font-sans)', outline: 'none', transition: 'border-color 0.2s' }}
                onFocus={e => e.target.style.borderColor = 'rgba(53,223,231,0.5)'}
                onBlur={e => e.target.style.borderColor = 'rgba(255,255,255,0.1)'}
              />
            </div>

            {/* Spend Slider */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                <label style={{ fontSize: 12, fontFamily: 'var(--font-mono)', color: 'var(--slate-400)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Monthly Cloud Spend</label>
                <span style={{ fontSize: 22, fontWeight: 700, color: 'var(--blue-400)', fontFamily: 'var(--font-mono)', letterSpacing: '-0.02em' }}>
                  {new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(spend)}
                </span>
              </div>
              <div style={{ position: 'relative' }}>
                <div style={{ position: 'absolute', top: '50%', left: 0, height: 6, width: `${pct}%`, background: 'linear-gradient(90deg, var(--blue-600), var(--blue-400))', borderRadius: 3, transform: 'translateY(-50%)', pointerEvents: 'none', zIndex: 1 }}></div>
                <input type="range" min="5000" max="100000" step="1000" value={spend} onChange={e => setSpend(Number(e.target.value))} style={{ position: 'relative', zIndex: 2 }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'var(--slate-600)', fontFamily: 'var(--font-mono)' }}>
                <span>$5k / mo</span><span>$100k / mo</span>
              </div>
            </div>

            {/* Series Selector */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <label style={{ fontSize: 12, fontFamily: 'var(--font-mono)', color: 'var(--slate-400)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Funding Series</label>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                {['B', 'C'].map(s => (
                  <button key={s} type="button" onClick={() => setSeries(s)} style={{
                    padding: '16px', borderRadius: 12,
                    background: series === s ? 'rgba(53,223,231,0.1)' : 'var(--slate-800)',
                    border: series === s ? '1px solid rgba(59,130,246,0.5)' : '1px solid rgba(255,255,255,0.08)',
                    color: series === s ? 'var(--blue-400)' : 'var(--slate-400)',
                    cursor: 'pointer', transition: 'all 0.2s', textAlign: 'left',
                  }}>
                    <div style={{ fontSize: 20, fontWeight: 700, fontFamily: 'var(--font-mono)', marginBottom: 4 }}>Series {s}</div>
                    <div style={{ fontSize: 12, opacity: 0.7 }}>{s === 'B' ? '~18% avg waste' : '~24% avg waste'}</div>
                  </button>
                ))}
              </div>
            </div>

            {err && (
              <div style={{ fontSize: 13, color: 'var(--red-400)', padding: '10px 14px', background: 'rgba(239,68,68,0.08)', borderRadius: 8, border: '1px solid rgba(239,68,68,0.2)' }}>
                {err}
              </div>
            )}

            <button type="submit" style={{
              padding: '16px', borderRadius: 12, border: 'none', cursor: 'pointer',
              fontFamily: 'var(--font-sans)', fontSize: 15, fontWeight: 600, letterSpacing: '-0.01em',
              background: 'linear-gradient(135deg, #1b3d76, #5ecece)',
              color: 'white', animation: 'ripple 2.5s infinite',
              boxShadow: '0 0 0 0 rgba(53,223,231,0.3)', transition: 'opacity 0.2s',
            }}
              onMouseEnter={e => e.currentTarget.style.opacity = '0.9'}
              onMouseLeave={e => e.currentTarget.style.opacity = '1'}
            >
              ⚡ Run Infrastructure Scan
            </button>

            <p style={{ textAlign: 'center', fontSize: 12, color: 'var(--slate-600)', lineHeight: 1.5 }}>
              No credentials required · Estimate only · Takes ~3 seconds
            </p>
          </form>

          {/* Trust signals */}
          <div style={{ display: 'flex', justifyContent: 'center', gap: 28, marginTop: 28, flexWrap: 'wrap' }}>
            {['10,247 Signals Analyzed', 'AWS · GCP · Azure', 'SOC 2 Aligned'].map(t => (
              <span key={t} style={{ fontSize: 12, color: 'var(--slate-600)', fontFamily: 'var(--font-mono)' }}>{t}</span>
            ))}
          </div>
        </div>
      </main>
    </div>
  );
}

/* ── PHASE 2: Scanning ───────────────────────────────────── */
function ScanPhase({ company, onComplete }) {
  const [count, setCount]       = useState(0);
  const [logLines, setLogLines] = useState([]);
  const [progress, setProgress] = useState(0);
  const logRef                  = useRef(null);

  const TARGET   = 10247;
  const DURATION = 3000;

  useEffect(() => {
    const start = Date.now();
    let frame;

    function tick() {
      const elapsed = Date.now() - start;
      const t = Math.min(elapsed / DURATION, 1);
      const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      setCount(Math.round(eased * TARGET));
      setProgress(t * 100);

      if (Math.random() < 0.18) {
        const cat = SIGNAL_CATEGORIES[Math.floor(t * SIGNAL_CATEGORIES.length * 1.2) % SIGNAL_CATEGORIES.length];
        const sig = cat.signals[Math.floor(Math.random() * cat.signals.length)];
        const cost = (Math.random() * 4200 + 80).toFixed(2);
        const severity = Math.random() > 0.6 ? '⚠' : '✓';
        setLogLines(prev => [...prev.slice(-18), { cat: cat.label, sig, cost, severity, id: Date.now() + Math.random() }]);
      }

      if (t < 1) {
        frame = requestAnimationFrame(tick);
      } else {
        setTimeout(onComplete, 400);
      }
    }

    frame = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frame);
  }, []);

  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [logLines]);

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--slate-950)', alignItems: 'center', justifyContent: 'center', padding: 20 }} className="grid-bg">
      <div style={{ width: '100%', maxWidth: 660 }}>

        {/* Header */}
        <div style={{ textAlign: 'center', marginBottom: 36 }}>
          <div style={{ display: 'inline-flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
            <div style={{ width: 10, height: 10, borderRadius: '50%', background: 'var(--blue-500)', animation: 'pulse 0.8s infinite' }}></div>
            <span style={{ fontSize: 13, fontFamily: 'var(--font-mono)', color: 'var(--blue-400)', letterSpacing: '0.1em' }}>AI INFRASTRUCTURE SCAN · {company.toUpperCase()}</span>
          </div>
          <div style={{ fontSize: 'clamp(40px,8vw,72px)', fontWeight: 700, fontFamily: 'var(--font-mono)', color: 'var(--blue-400)', letterSpacing: '-0.04em', lineHeight: 1 }}>
            {count.toLocaleString()}
          </div>
          <div style={{ fontSize: 13, color: 'var(--slate-500)', fontFamily: 'var(--font-mono)', marginTop: 6, letterSpacing: '0.06em' }}>SIGNALS ANALYZED</div>
        </div>

        {/* Progress bar */}
        <div style={{ height: 4, background: 'var(--slate-800)', borderRadius: 2, marginBottom: 28, overflow: 'hidden' }}>
          <div style={{
            height: '100%', width: `${progress}%`,
            background: 'linear-gradient(90deg, var(--blue-600), var(--blue-400))',
            borderRadius: 2, transition: 'width 0.05s linear',
            boxShadow: '0 0 12px rgba(53,223,231,0.5)',
          }}></div>
        </div>

        {/* Log terminal */}
        <div ref={logRef} style={{
          background: 'var(--slate-900)', border: '1px solid rgba(53,223,231,0.1)',
          borderRadius: 16, padding: '20px', height: 280,
          overflowY: 'hidden', fontFamily: 'var(--font-mono)', fontSize: 11.5,
          display: 'flex', flexDirection: 'column', gap: 5,
          position: 'relative',
        }} className="card-glow">
          {/* scan line */}
          <div style={{
            position: 'absolute', left: 0, right: 0, height: 32,
            background: 'linear-gradient(180deg, transparent, rgba(53,223,231,0.05), transparent)',
            animation: 'scanLine 1.2s linear infinite', pointerEvents: 'none', zIndex: 2,
          }}></div>

          {logLines.map((line, i) => (
            <div key={line.id} style={{
              display: 'flex', gap: 10, alignItems: 'baseline',
              opacity: Math.max(0.3, i / logLines.length),
              animation: 'slideUp 0.2s ease forwards',
            }}>
              <span style={{ color: line.severity === '⚠' ? 'var(--amber-400)' : 'var(--emerald-500)', minWidth: 12 }}>{line.severity}</span>
              <span style={{ color: 'var(--slate-500)', minWidth: 90 }}>[{line.cat}]</span>
              <span style={{ color: 'var(--slate-300)', flex: 1 }}>{line.sig}</span>
              <span style={{ color: line.severity === '⚠' ? 'var(--amber-400)' : 'var(--slate-600)', minWidth: 80, textAlign: 'right' }}>
                {line.severity === '⚠' ? `-$${line.cost}` : 'CLEAN'}
              </span>
            </div>
          ))}
          {logLines.length === 0 && (
            <div style={{ color: 'var(--slate-600)' }}>Initializing scan engine...</div>
          )}
        </div>

        {/* Category pills */}
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', justifyContent: 'center', marginTop: 20 }}>
          {SIGNAL_CATEGORIES.map((cat, i) => {
            const active = Math.floor((progress / 100) * SIGNAL_CATEGORIES.length * 1.2) % SIGNAL_CATEGORIES.length === i;
            return (
              <div key={cat.label} style={{
                padding: '5px 12px', borderRadius: 99, fontSize: 11, fontFamily: 'var(--font-mono)',
                background: active ? 'rgba(53,223,231,0.12)' : 'var(--slate-800)',
                border: active ? '1px solid rgba(53,223,231,0.3)' : '1px solid transparent',
                color: active ? 'var(--blue-300)' : 'var(--slate-600)',
                transition: 'all 0.3s',
              }}>{cat.label}</div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ── App root ─────────────────────────────────────────────── */
function App() {
  const urlDefaults = readURLParams();
  const [phase, setPhase]           = useState('input');
  const [formData, setFormData]     = useState(null);
  const [report, setReport]         = useState(null);
  // Auto-advance if URL params are fully populated
  useEffect(() => {
    if (urlDefaults.company && urlDefaults.series) {
      const r = calcReport(urlDefaults.company, urlDefaults.spend, urlDefaults.series);
      setFormData({ company: urlDefaults.company, spend: urlDefaults.spend, series: urlDefaults.series });
      setReport(r);
      setPhase('scan');
    }
  }, []);

  function handleInputSubmit(company, spend, series) {
    const r = calcReport(company, spend, series);
    setFormData({ company, spend, series });
    setReport(r);
    setPhase('scan');
    const url = new URL(window.location.href);
    url.searchParams.set('company', company);
    url.searchParams.set('spend', spend);
    url.searchParams.set('series', series);
    window.history.replaceState({}, '', url);
  }

  function handleReset() {
    setPhase('input');
    setReport(null);
    const url = new URL(window.location.href);
    ['company', 'spend', 'series'].forEach(k => url.searchParams.delete(k));
    window.history.replaceState({}, '', url);
  }

  return (
    <>
      {phase === 'input'  && <InputPhase onSubmit={handleInputSubmit} defaults={urlDefaults} />}
      {phase === 'scan'   && <ScanPhase company={formData.company} onComplete={() => setPhase('report')} />}
      {phase === 'report' && <ReportPhase report={report} onReset={handleReset} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
